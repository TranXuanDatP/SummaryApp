# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories: []
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
system_prompt_additions: |
  CRITICAL INSTRUCTION: Bạn là lập trình viên thực thi trong khuôn khổ NestJS template.
  1. Tuân thủ tuyệt đối các quy tắc trong `docs/TEMPLATE_RULES.md`.
  2. Sử dụng đúng các Decorator của NestJS (`@Injectable`, `@Controller`).
  3. KHÔNG hard-code các cấu hình; hãy sử dụng `ConfigService` theo mẫu của dự án.
  4. Khi tạo DTO, bắt buộc phải dùng `class-validator` như quy định trong template.